<script>
/* ================================
   USUARIOS PERMITIDOS
================================ */
const usuarios = [
  { usuario: "admin", pass: "1234" },
  { usuario: "tienda1", pass: "1111" },
  { usuario: "tienda2", pass: "2222" },
  { usuario: "tienda3", pass: "3333" }
];

/* Carga datos guardados */
let cobros = JSON.parse(localStorage.getItem("cobros_efectivo") || "[]");

/* Usuario actual */
let usuarioActual = null;

/* ================================
   LOGIN
================================ */
const loginOverlay = document.getElementById("loginOverlay");
const btnLogin = document.getElementById("btnLogin");

btnLogin.addEventListener("click", () => {
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();

  const encontrado = usuarios.find(u => u.usuario === user && u.pass === pass);

  if (!encontrado) {
    document.getElementById("loginError").style.display = "block";
    return;
  }

  usuarioActual = user;
  document.getElementById("usuarioActual").textContent = usuarioActual;

  loginOverlay.style.display = "none";
  actualizarSelectsUsuarios();
  renderTabla();
});

/* LOGOUT */
document.getElementById("btnLogout").addEventListener("click", () => {
  usuarioActual = null;
  loginOverlay.style.display = "flex";
});

/* ================================
   CÁLCULO AUTOMÁTICO DIFERENCIA
================================ */
function calcularDiferencia() {
  const esperado = parseFloat(document.getElementById("importeCobro").value) || 0;
  const recibido = parseFloat(document.getElementById("importeRecibido").value) || 0;
  const dif = recibido - esperado;

  const campo = document.getElementById("importeDiferencia");
  campo.value = dif.toFixed(2);

  if (dif === 0) {
    campo.style.color = "#0a7d0a"; // verde
  } else {
    campo.style.color = "#c62828"; // rojo
  }
}

document.getElementById("importeCobro").addEventListener("input", calcularDiferencia);
document.getElementById("importeRecibido").addEventListener("input", calcularDiferencia);

/* ================================
   FORMULARIO AÑADIR COBRO
================================ */
document.getElementById("formCobro").addEventListener("submit", (e) => {
  e.preventDefault();

  const fecha = document.getElementById("fechaCobro").value;
  const esperado = parseFloat(document.getElementById("importeCobro").value);
  const recibido = parseFloat(document.getElementById("importeRecibido").value) || 0;
  const diferencia = recibido - esperado;
  const nota = document.getElementById("notaCobro").value.trim();
  const recibidoSN = document.getElementById("recibidoCobro").value;
  const cobra = document.getElementById("cobraCobro").value;

  if (!fecha || isNaN(esperado)) {
    alert("Faltan datos obligatorios.");
    return;
  }

  cobros.push({
    fecha,
    esperado,
    recibido,
    diferencia,
    nota,
    recibidoSN,
    creadoPor: usuarioActual,
    cobra
  });

  guardarDatos();
  renderTabla();

  document.getElementById("formCobro").reset();
  document.getElementById("importeDiferencia").value = "";
});

/* ================================
   ACTUALIZAR SELECT USUARIOS
================================ */
function actualizarSelectsUsuarios() {
  const cobraSelect = document.getElementById("cobraCobro");
  const filtroCreador = document.getElementById("filtroCreador");
  const filtroCobrador = document.getElementById("filtroCobrador");

  cobraSelect.innerHTML = "";
  filtroCreador.innerHTML = "<option value='todos'>Todos</option>";
  filtroCobrador.innerHTML = "<option value='todos'>Todos</option>";

  usuarios.forEach(u => {
    cobraSelect.innerHTML += `<option value="${u.usuario}">${u.usuario}</option>`;
    filtroCreador.innerHTML += `<option value="${u.usuario}">${u.usuario}</option>`;
    filtroCobrador.innerHTML += `<option value="${u.usuario}">${u.usuario}</option>`;
  });
}

/* ================================
   TABLA
================================ */
const tbody = document.getElementById("tbodyCobros");

function renderTabla() {
  tbody.innerHTML = "";

  let lista = filtrarDatos(cobros);

  /* Ordenar FECHA DESCENDENTE */
  lista.sort((a, b) => b.fecha.localeCompare(a.fecha));

  if (lista.length === 0) {
    document.getElementById("mensajeSinDatos").style.display = "block";
    actualizarResumen(lista);
    return;
  }

  document.getElementById("mensajeSinDatos").style.display = "none";

  lista.forEach((c, index) => {
    const tr = document.createElement("tr");

    const dia = new Date(c.fecha).toLocaleDateString("es-es", { weekday: "long" });

    tr.innerHTML = `
      <td>${c.fecha}</td>
      <td>${dia}</td>
      <td class="text-right">${c.esperado.toFixed(2)}</td>
      <td class="text-right">${c.recibido.toFixed(2)}</td>
      <td class="text-right" style="font-weight:bold; color:${c.diferencia === 0 ? "#0a7d0a" : "#c62828"};">
        ${c.diferencia.toFixed(2)}
      </td>
      <td>${c.nota}</td>
      <td>${c.recibidoSN}</td>
      <td>${c.creadoPor}</td>
      <td>${c.cobra}</td>
      <td><button class="btn-danger" onclick="borrar(${index})">X</button></td>
    `;
    tbody.appendChild(tr);
  });

  actualizarResumen(lista);
}

/* ================================
   BORRAR REGISTRO
================================ */
function borrar(index) {
  if (!confirm("¿Seguro que quieres borrar este movimiento?")) return;
  cobros.splice(index, 1);
  guardarDatos();
  renderTabla();
}

/* ================================
   GUARDAR
================================ */
function guardarDatos() {
  localStorage.setItem("cobros_efectivo", JSON.stringify(cobros));
}

/* ================================
   FILTROS
================================ */
document.querySelectorAll("#filtroNota, #filtroFechaDesde, #filtroFechaHasta, #filtroRecibido, #filtroCreador, #filtroCobrador")
  .forEach(elem => elem.addEventListener("input", renderTabla));

document.getElementById("btnLimpiarFiltros").addEventListener("click", () => {
  document.getElementById("filtroNota").value = "";
  document.getElementById("filtroFechaDesde").value = "";
  document.getElementById("filtroFechaHasta").value = "";
  document.getElementById("filtroRecibido").value = "todos";
  document.getElementById("filtroCreador").value = "todos";
  document.getElementById("filtroCobrador").value = "todos";
  renderTabla();
});

/* ================================
   FILTRAR
================================ */
function filtrarDatos(lista) {
  const fNota = document.getElementById("filtroNota").value.toLowerCase();
  const fDesde = document.getElementById("filtroFechaDesde").value;
  const fHasta = document.getElementById("filtroFechaHasta").value;
  const fRecibido = document.getElementById("filtroRecibido").value;
  const fCreador = document.getElementById("filtroCreador").value;
  const fCobrador = document.getElementById("filtroCobrador").value;

  return lista.filter(c => {
    if (fNota && !c.nota.toLowerCase().includes(fNota)) return false;
    if (fDesde && c.fecha < fDesde) return false;
    if (fHasta && c.fecha > fHasta) return false;
    if (fRecibido === "recibidos" && c.recibidoSN !== "Sí") return false;
    if (fRecibido === "pendientes" && c.recibidoSN !== "No") return false;
    if (fCreador !== "todos" && c.creadoPor !== fCreador) return false;
    if (fCobrador !== "todos" && c.cobra !== fCobrador) return false;
    return true;
  });
}

/* ================================
   RESUMEN
================================ */
function actualizarResumen(lista) {
  const total = lista.reduce((s, c) => s + c.esperado, 0);
  document.getElementById("resumenCobros").textContent =
    `${lista.length} movimientos · Total: ${total.toFixed(2)} €`;
}

/* ================================
   EXPORTAR CSV
================================ */
document.getElementById("btnExportar").addEventListener("click", () => {
  let csv = "Fecha,Día,Importe esperado,Importe recibido,Diferencia,Tienda,Recibido,Creado por,Cobra\n";

  cobros.forEach(c => {
    const dia = new Date(c.fecha).toLocaleDateString("es-es", { weekday: "long" });
    csv += `${c.fecha},${dia},${c.esperado.toFixed(2)},${c.recibido.toFixed(2)},${c.diferencia.toFixed(2)},"${c.nota}",${c.recibidoSN},${c.creadoPor},${c.cobra}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "cobros.csv";
  a.click();

  URL.revokeObjectURL(url);
});
</script>
