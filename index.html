<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;padding:1rem;background:#e6e6e6}
.app{max-width:1100px;margin:auto;background:#fff;padding:1.5rem;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
h1{margin:0}
.subtitle{color:#555;margin-bottom:1rem}
button{border:0;border-radius:8px;padding:.6rem 1rem;cursor:pointer}
.primary{background:#1a1a1a;color:#fff}
.secondary{background:#666;color:#fff}
.danger{background:#c62828;color:#fff}
form{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;margin-bottom:1rem}
label{font-size:.85rem;font-weight:600}
input,select,textarea{width:100%;padding:.55rem;border-radius:8px;border:1px solid #bbb}
textarea{resize:vertical}
table{width:100%;border-collapse:collapse}
th,td{padding:.6rem;border-bottom:1px solid #eee;font-size:.9rem}
th{background:#f2f2f2}
.text-right{text-align:right}
.si{color:#0a7d0a;font-weight:700}
.no{color:#c62828;font-weight:700}
@media(max-width:900px){form{grid-template-columns:1fr 1fr}}
@media(max-width:600px){form{grid-template-columns:1fr}}
#login{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#loginBox{background:#fff;padding:1.4rem;border-radius:14px;width:320px}
#loginBox input{margin-bottom:.6rem}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="loginBox">
    <h2>Acceso</h2>
    <div id="loginError" style="color:red;display:none">Datos incorrectos</div>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<div class="app">
<h1>Efectivo</h1>
<p class="subtitle">Registro de cobros por tienda</p>

<p>Usuario actual: <b id="usuario"></b>
<button class="secondary" onclick="logout()">Cambiar usuario</button></p>

<form onsubmit="add(event)">
  <div>
    <label>Fecha</label>
    <input type="date" id="fecha" required>
  </div>
  <div>
    <label>Importe (€)</label>
    <input type="number" step="0.01" id="importe" required>
  </div>
  <div>
    <label>Tienda</label>
    <textarea id="tienda"></textarea>
  </div>
  <div>
    <label>Recibido</label>
    <select id="recibido">
      <option>No</option>
      <option>Sí</option>
    </select>
  </div>
  <div>
    <label>Cobra</label>
    <select id="cobra"></select>
  </div>
  <div>
    <button class="primary">Añadir movimiento</button>
  </div>
</form>

<table>
<thead>
<tr>
<th>Fecha</th>
<th>Día</th>
<th class="text-right">Importe</th>
<th>Tienda</th>
<th>Recibido</th>
<th>Creado</th>
<th>Cobra</th>
<th></th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>

<script>
const usuarios=[
 {u:"admin",p:"1234"},
 {u:"tienda1",p:"1111"},
 {u:"tienda2",p:"2222"},
 {u:"tienda3",p:"3333"}
];

let actual=null;
let datos=JSON.parse(localStorage.getItem("efectivo")||"[]");

function login(){
 const u=user.value,p=pass.value;
 const ok=usuarios.find(x=>x.u===u&&x.p===p);
 if(!ok){loginError.style.display="block";return}
 actual=u;
 usuario.textContent=u;
 login.style.display="none";
 cargarUsuarios();
 pintar();
}

function logout(){
 actual=null;
 login.style.display="flex";
}

function cargarUsuarios(){
 cobra.innerHTML="";
 usuarios.forEach(x=>{
  let o=document.createElement("option");
  o.textContent=x.u;
  cobra.appendChild(o);
 });
}

function add(e){
 e.preventDefault();
 datos.push({
  fecha:fecha.value,
  importe:parseFloat(importe.value),
  tienda:tienda.value,
  recibido:recibido.value,
  creado:actual,
  cobra:cobra.value
 });
 guardar();
 e.target.reset();
 pintar();
}

function pintar(){
 tabla.innerHTML="";
 datos
 .sort((a,b)=>b.fecha.localeCompare(a.fecha))
 .forEach((d,i)=>{
  const dia=new Date(d.fecha).toLocaleDateString("es",{weekday:"long"});
  tabla.innerHTML+=`
  <tr>
   <td>${d.fecha}</td>
   <td>${dia}</td>
   <td class="text-right">${d.importe.toFixed(2)}</td>
   <td>${d.tienda}</td>
   <td class="${d.recibido==="Sí"?"si":"no"}">${d.recibido}</td>
   <td>${d.creado}</td>
   <td>${d.cobra}</td>
   <td><button class="danger" onclick="del(${i})">X</button></td>
  </tr>`;
 });
}

function del(i){
 if(!confirm("¿Borrar este movimiento?"))return;
 datos.splice(i,1);
 guardar(); pintar();
}

function guardar(){
 localStorage.setItem("efectivo",JSON.stringify(datos));
}
</script>

</body>
</html>
