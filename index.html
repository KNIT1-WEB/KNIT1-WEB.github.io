<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:1rem;background:#e6e6e6}
.app{max-width:1200px;margin:auto;background:#fff;padding:1.5rem;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
h1{margin-top:0}
button{border:0;border-radius:8px;padding:.6rem 1rem;cursor:pointer}
.primary{background:#111;color:#fff}
.secondary{background:#666;color:#fff}
.danger{background:#c62828;color:#fff}
form, .filters{display:grid;gap:1rem}
form{grid-template-columns:repeat(6,1fr);margin-bottom:1.5rem}
.filters{grid-template-columns:repeat(6,1fr);background:#f4f4f4;padding:1rem;border-radius:10px;margin:2rem 0}
label{font-size:.85rem;font-weight:600}
input,select,textarea{width:100%;padding:.5rem;border-radius:8px;border:1px solid #bbb}
table{width:100%;border-collapse:collapse}
th,td{padding:.6rem;border-bottom:1px solid #eee;font-size:.9rem}
th{background:#f1f1f1}
.right{text-align:right}
.ok{color:#0a7d0a;font-weight:700}
.no{color:#c62828;font-weight:700}
@media(max-width:900px){
  form,.filters{grid-template-columns:1fr}
}
#login{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#loginBox{background:#fff;padding:1.5rem;border-radius:12px;width:320px}
</style>
</head>
<body>

<div id="login">
  <div id="loginBox">
    <h2>Acceso</h2>
    <input id="lUser" placeholder="Usuario">
    <input id="lPass" type="password" placeholder="Contraseña">
    <p id="lErr" style="color:red;display:none">Datos incorrectos</p>
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<div class="app">
<h1>Efectivo</h1>
<p>Registro de cobros por tienda</p>

<p>Usuario actual: <b id="uActual"></b>
<button class="secondary" onclick="logout()">Cambiar usuario</button>
</p>

<form id="form">
  <div><label>Fecha</label><input type="date" id="fFecha"></div>
  <div><label>Importe anotado</label><input type="number" id="fImp" step="0.01"></div>
  <div><label>Tienda</label><textarea id="fTienda"></textarea></div>
  <div><label>Recibido</label>
    <select id="fRec"><option>No</option><option>Sí</option></select>
  </div>
  <div><label>Importe recibido</label><input type="number" id="fReal" step="0.01"></div>
  <div><button class="primary">Añadir</button></div>
</form>

<div class="filters">
  <div><label>Tienda</label><input id="ftTienda"></div>
  <div><label>Desde</label><input type="date" id="ftDesde"></div>
  <div><label>Hasta</label><input type="date" id="ftHasta"></div>
  <div><label>Recibido</label>
    <select id="ftRec"><option value="">Todos</option><option>No</option><option>Sí</option></select>
  </div>
  <div><label>Creador</label><select id="ftUser"></select></div>
  <div><button class="secondary" onclick="clearFilters()">Quitar filtros</button></div>
</div>

<p id="resumen"></p>

<table>
<thead>
<tr>
<th>Fecha</th><th>Día</th><th class="right">Importe</th><th>Tienda</th>
<th>Recibido</th><th class="right">Real</th><th>Diferencia</th><th>Usuario</th><th></th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<script>
const users=[
{u:"admin",p:"1234",r:"admin"},
{u:"tienda1",p:"1111",r:"tienda"},
{u:"tienda2",p:"2222",r:"tienda"},
{u:"tienda3",p:"3333",r:"tienda"}
];
let user=null;
let data=JSON.parse(localStorage.getItem("efectivo")||"[]");

function login(){
const u=lUser.value,p=lPass.value;
const ok=users.find(x=>x.u===u&&x.p===p);
if(!ok){lErr.style.display="block";return}
user=ok;login.style.display="none";
uActual.textContent=user.u;
fillUsers();render();
}
function logout(){location.reload()}

form.onsubmit=e=>{
e.preventDefault();
data.push({
id:Date.now(),fecha:fFecha.value,imp:+fImp.value||0,
tienda:fTienda.value,rec:fRec.value,real:+fReal.value||0,
user:user.u
});
save();form.reset();
};

function fillUsers(){
ftUser.innerHTML="<option value=''>Todos</option>";
users.forEach(u=>ftUser.innerHTML+=`<option>${u.u}</option>`);
}

function clearFilters(){
[ftTienda,ftDesde,ftHasta].forEach(i=>i.value="");
ftRec.value="";ftUser.value="";render();
}

document.querySelectorAll("input,select").forEach(e=>e.oninput=render);

function render(){
let l=[...data];
if(ftTienda.value)l=l.filter(x=>x.tienda.toLowerCase().includes(ftTienda.value.toLowerCase()));
if(ftDesde.value)l=l.filter(x=>x.fecha>=ftDesde.value);
if(ftHasta.value)l=l.filter(x=>x.fecha<=ftHasta.value);
if(ftRec.value)l=l.filter(x=>x.rec===ftRec.value);
if(ftUser.value)l=l.filter(x=>x.user===ftUser.value);

tabla.innerHTML="";
let pendiente=0;

l.forEach(x=>{
const dif=(x.imp||0)-(x.real||0);
if(x.rec==="No")pendiente+=x.imp||0;

tabla.innerHTML+=`
<tr>
<td>${x.fecha}</td>
<td>${new Date(x.fecha).toLocaleDateString("es",{weekday:"short"})}</td>
<td class="right">${x.imp.toFixed(2)}</td>
<td>${x.tienda}</td>
<td>
<select ${user.r!=="admin"?"":"onchange='chgRec("+x.id+",this.value)'"} ${user.r==="tienda"?"":"disabled"}>
<option ${x.rec==="No"?"selected":""}>No</option>
<option ${x.rec==="Sí"?"selected":""}>Sí</option>
</select>
</td>
<td class="right">
<input type="number" value="${x.real}" ${user.r!=="admin"?"disabled":""}
onchange="chgReal(${x.id},this.value)">
</td>
<td class="right">${dif.toFixed(2)}</td>
<td>${x.user}</td>
<td>${user.r==="admin"?`<button class="danger" onclick="del(${x.id})">X</button>`:""}</td>
</tr>`;
});

resumen.textContent=`Movimientos: ${l.length} · Pendiente: ${pendiente.toFixed(2)} €`;
}

function chgRec(id,v){const x=data.find(i=>i.id===id);x.rec=v;save()}
function chgReal(id,v){const x=data.find(i=>i.id===id);x.real=+v||0;save()}
function del(id){if(confirm("¿Borrar?")){data=data.filter(x=>x.id!==id);save()}}
function save(){localStorage.setItem("efectivo",JSON.stringify(data));render()}
</script>
</body>
</html>
