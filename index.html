<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efectivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #eee;
      padding: 20px;
    }

    .app {
      background: white;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
    }

    h1 { margin-top: 0; }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select, button {
      padding: 8px;
      font-size: 14px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    .login {
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Efectivo</h1>

  <!-- LOGIN -->
  <div class="login" id="loginBox">
    <div class="row">
      <select id="loginUser">
        <option value="admin">admin</option>
        <option value="tienda1">tienda1</option>
        <option value="tienda2">tienda2</option>
      </select>

      <input type="password" id="loginPass" placeholder="Contraseña">

      <button id="btnLogin">Entrar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="appBox" class="hidden">

    <p>Usuario actual: <strong id="usuarioActual"></strong></p>

    <!-- FORMULARIO -->
    <div class="row">
      <input type="date" id="fecha">
      <input type="number" id="importe" placeholder="Importe anotado">
      <input type="text" id="tienda" placeholder="Tienda">
      <select id="recibido">
        <option value="No">No</option>
        <option value="Si">Sí</option>
      </select>
      <input type="number" id="importeRecibido" placeholder="Importe recibido">
      <button id="btnAdd">Añadir</button>
    </div>

    <!-- TABLA -->
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Importe</th>
          <th>Tienda</th>
          <th>Recibido</th>
          <th>Importe recibido</th>
          <th>Creado por</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

  </div>

</div>

<script>
  // ESTADO
  let usuario = null;
  let movimientos = [];

  // LOGIN
  document.getElementById("btnLogin").addEventListener("click", () => {
    const u = document.getElementById("loginUser").value;
    const p = document.getElementById("loginPass").value;

    // contraseñas simples (FASE 1)
    if (
      (u === "admin" && p === "admin") ||
      (u !== "admin" && p === "tienda")
    ) {
      usuario = u;
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      document.getElementById("usuarioActual").textContent = usuario;
    } else {
      alert("Usuario o contraseña incorrectos");
    }
  });

  // AÑADIR MOVIMIENTO
  document.getElementById("btnAdd").addEventListener("click", () => {
    const movimiento = {
      fecha: document.getElementById("fecha").value || "",
      importe: document.getElementById("importe").value || "",
      tienda: document.getElementById("tienda").value || "",
      recibido: document.getElementById("recibido").value,
      importeRecibido: document.getElementById("importeRecibido").value || "",
      creador: usuario
    };

    movimientos.push(movimiento);
    renderTabla();
    limpiarFormulario();
  });

  function renderTabla() {
    const tbody = document.getElementById("tabla");
    tbody.innerHTML = "";

    movimientos.forEach(m => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${m.fecha}</td>
        <td>${m.importe}</td>
        <td>${m.tienda}</td>
        <td>${m.recibido}</td>
        <td>${m.importeRecibido}</td>
        <td>${m.creador}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function limpiarFormulario() {
    document.getElementById("importe").value = "";
    document.getElementById("tienda").value = "";
    document.getElementById("importeRecibido").value = "";
    document.getElementById("recibido").value = "No";
  }
</script>

</body>
</html>
