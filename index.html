<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;padding:20px;background:#e6e6e6}
.app{max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
h1{margin:0}
.section{margin-top:25px;padding:15px;background:#f4f4f4;border-radius:10px}
form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
label{font-weight:600;font-size:.85rem}
input,select,textarea,button{padding:8px;border-radius:8px;border:1px solid #bbb;font-size:.9rem}
textarea{resize:vertical}
button{background:#111;color:#fff;border:none;cursor:pointer}
button.gray{background:#666}
button.red{background:#c62828}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #ddd;font-size:.9rem}
th{background:#eee}
.right{text-align:right}
.ok{color:green;font-weight:700}
.no{color:red;font-weight:700}
@media(max-width:900px){form{grid-template-columns:1fr 1fr}}
@media(max-width:600px){form{grid-template-columns:1fr}}
</style>
</head>

<body>

<script>
const USERS={
 admin:{pass:"1234",rol:"admin"},
 tienda1:{pass:"1111",rol:"tienda"},
 tienda2:{pass:"2222",rol:"tienda"},
 tienda3:{pass:"3333",rol:"tienda"}
};
</script>

<!-- LOGIN -->
<div id="login" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;padding:20px;border-radius:14px;width:300px">
    <h3>Acceso</h3>
    <div id="err" style="color:red;display:none">Usuario o contraseña incorrectos</div>
    <input id="lu" placeholder="Usuario">
    <input id="lp" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<div class="app">
<h1>Efectivo</h1>
<p>Usuario: <b id="u"></b></p>

<!-- ALTA (solo admin) -->
<div class="section" id="alta">
<form onsubmit="add(event)">
  <div>
    <label>Fecha</label>
    <input type="date" id="aFecha" required>
  </div>
  <div>
    <label>Importe anotado</label>
    <input type="number" id="aImp" step="0.01" required>
  </div>
  <div>
    <label>Tienda</label>
    <textarea id="aTienda"></textarea>
  </div>
  <div><button>Añadir</button></div>
</form>
</div>

<!-- FILTROS -->
<div class="section">
<form>
  <div><label>Tienda</label><input id="fTienda"></div>
  <div><label>Desde</label><input type="date" id="fDesde"></div>
  <div><label>Hasta</label><input type="date" id="fHasta"></div>
  <div>
    <label>Recibido</label>
    <select id="fRec">
      <option value="">Todos</option>
      <option>No</option>
      <option>Sí</option>
    </select>
  </div>
  <div>
    <label>Creador</label>
    <select id="fUser"></select>
  </div>
  <div><button type="button" class="gray" onclick="clearFilters()">Quitar filtros</button></div>
</form>
</div>

<p id="resumen"></p>

<table>
<thead>
<tr>
<th>Fecha</th><th>Día</th><th class="right">Importe</th>
<th>Tienda</th><th>Recibido</th><th class="right">Recibido €</th>
<th class="right">Dif.</th><th>Usuario</th><th></th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

<script>
let actual=null,rol=null;
let data=JSON.parse(localStorage.getItem("efectivo")||"[]");

function login(){
 const u=lu.value,p=lp.value;
 if(!USERS[u]||USERS[u].pass!==p){err.style.display="block";return;}
 actual=u;rol=USERS[u].rol;
 document.getElementById("login").style.display="none";
 document.getElementById("u").textContent=u;
 if(rol!=="admin") document.getElementById("alta").style.display="none";
 fillUsers(); render();
}

function add(e){
 e.preventDefault();
 data.push({
  id: Date.now() + Math.random(),
  fecha: aFecha.value,
  importe: +aImp.value,
  tienda: aTienda.value,
  recibido: "No",
  real: 0,
  user: actual
 });
 save(); e.target.reset(); render();
}

function render(){
 tb.innerHTML="";
 let list=data.filter(x=>{
  if(fTienda.value && !x.tienda.toLowerCase().includes(fTienda.value.toLowerCase()))return false;
  if(fDesde.value && x.fecha<fDesde.value)return false;
  if(fHasta.value && x.fecha>fHasta.value)return false;
  if(fRec.value && x.recibido!==fRec.value)return false;
  if(fUser.value && x.user!==fUser.value)return false;
  return true;
 }).sort((a,b)=>b.fecha.localeCompare(a.fecha));

 let pendiente=0;
 list.forEach(x=>{
  const dif=x.real-x.importe;
  if(x.recibido==="No") pendiente+=x.importe;
  tb.innerHTML+=`
<tr>
<td>${x.fecha}</td>
<td>${new Date(x.fecha).toLocaleDateString("es",{weekday:"short"})}</td>
<td class="right">${x.importe.toFixed(2)}</td>
<td>${x.tienda}</td>
<td>
${rol==="admin"||rol==="tienda"?`
<select onchange="
 const r=data.find(d=>d.id===${x.id});
 r.recibido=this.value;
 save();render();
">
<option ${x.recibido==="No"?"selected":""}>No</option>
<option ${x.recibido==="Sí"?"selected":""}>Sí</option>
</select>`:x.recibido}
</td>
<td>
${rol==="admin"||rol==="tienda"?`
<input type="number" step="0.01" value="${x.real}"
 onchange="
 const r=data.find(d=>d.id===${x.id});
 r.real=+this.value||0;
 save();render();
">`
:x.real.toFixed(2)}
</td>
<td class="right ${dif<0?'no':'ok'}">${dif.toFixed(2)}</td>
<td>${x.user}</td>
<td>${rol==="admin"?`<button class="red" onclick="del(${x.id})">X</button>`:""}</td>
</tr>`;
 });
 resumen.textContent=`Movimientos: ${list.length} · Pendiente: ${pendiente.toFixed(2)} €`;
}

function del(id){
 if(confirm("¿Borrar este movimiento?")){
  data=data.filter(d=>d.id!==id);
  save(); render();
 }
}

function save(){localStorage.setItem("efectivo",JSON.stringify(data))}
function fillUsers(){
 fUser.innerHTML="<option value=''>Todos</option>";
 Object.keys(USERS).forEach(u=>fUser.innerHTML+=`<option>${u}</option>`);
}
function clearFilters(){
 fTienda.value=fDesde.value=fHasta.value=fRec.value=fUser.value="";
 render();
}
</script>

</body>
</html>
