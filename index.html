<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{font-family:system-ui;background:#e6e6e6;margin:0;padding:20px}
.app{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:14px}
h1{margin:0}
form,.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
.filters{background:#f3f3f3;padding:14px;border-radius:12px;margin-top:30px}
input,select,button{padding:8px;border-radius:8px;border:1px solid #bbb}
button{cursor:pointer;background:#111;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:8px;border-bottom:1px solid #eee}
th{background:#f0f0f0}
.text-right{text-align:right}
.red{color:#c62828;font-weight:700}
.green{color:#0a7d0a;font-weight:700}
</style>
</head>

<body>

<div class="app">

<h1>Efectivo</h1>
<p>Registro de cobros por tienda</p>

<div id="loginBox">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">

<p>Usuario: <strong id="userMail"></strong>
<button onclick="logout()">Salir</button></p>

<form onsubmit="addMovimiento(event)">
  <input type="date" id="fecha" required>
  <input type="number" id="importe" placeholder="Importe anotado" step="0.01" required>
  <input id="tienda" placeholder="Tienda" required>
  <select id="recibido">
    <option value="No">No</option>
    <option value="Sí">Sí</option>
  </select>
  <input type="number" id="real" placeholder="Importe recibido" step="0.01">
  <button>Añadir</button>
</form>

<div class="filters">
  <input id="fTienda" placeholder="Filtrar tienda">
  <input type="date" id="fDesde">
  <input type="date" id="fHasta">
  <select id="fRec">
    <option value="">Todos</option>
    <option value="Sí">Recibidos</option>
    <option value="No">Pendientes</option>
  </select>
  <button onclick="clearFilters()">Quitar filtros</button>
</div>

<p id="resumen"></p>

<table>
<thead>
<tr>
<th>Fecha</th><th>Tienda</th><th>Importe</th>
<th>Recibido</th><th>Real</th><th>Diferencia</th><th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgFywPttkRgTTPS-arf7JZTo6cur7BbqM",
  authDomain: "efectivo-4234e.firebaseapp.com",
  projectId: "efectivo-4234e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(u=>{
  if(u){
    userMail.textContent=u.email;
    loginBox.style.display="none";
    app.style.display="block";
    listen();
  }else{
    app.style.display="none";
    loginBox.style.display="block";
  }
});

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert("Error de acceso"));
}

function logout(){auth.signOut()}

function addMovimiento(e){
  e.preventDefault();
  db.collection("movimientos").add({
    fecha:fecha.value,
    tienda:tienda.value,
    importe:+importe.value,
    real:+real.value||0,
    recibido:recibido.value,
    user:auth.currentUser.email,
    ts:firebase.firestore.FieldValue.serverTimestamp()
  });
  e.target.reset();
}

function listen(){
  db.collection("movimientos").orderBy("fecha","desc")
  .onSnapshot(s=>{
    tbody.innerHTML="";
    let pendiente=0;
    s.forEach(d=>{
      const m=d.data();
      const diff=(m.real||0)-m.importe;
      if(m.recibido==="No") pendiente+=m.importe;
      tbody.innerHTML+=`
      <tr>
        <td>${m.fecha}</td>
        <td>${m.tienda}</td>
        <td class="text-right">${m.importe.toFixed(2)}</td>
        <td>${m.recibido}</td>
        <td class="text-right">${(m.real||0).toFixed(2)}</td>
        <td class="text-right ${diff!==0?'red':'green'}">${diff.toFixed(2)}</td>
        <td><button onclick="del('${d.id}')">X</button></td>
      </tr>`;
    });
    resumen.textContent=`Pendiente total: ${pendiente.toFixed(2)} €`;
  });
}

function del(id){
  if(confirm("¿Borrar movimiento?"))
    db.collection("movimientos").doc(id).delete();
}

function clearFilters(){
  fTienda.value=fDesde.value=fHasta.value=fRec.value="";
}
</script>

</body>
</html>
