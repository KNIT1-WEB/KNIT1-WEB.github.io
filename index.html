<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:1rem;background:#e6e6e6}
.app{max-width:1200px;margin:auto;background:#fff;padding:1.5rem;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
h1{margin:0}
.sub{color:#555;margin-bottom:1rem}

.row{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;align-items:end}
.filters{margin:2rem 0;padding:1rem;background:#f4f4f4;border-radius:10px}
input,select,textarea,button{padding:.55rem;border-radius:8px;border:1px solid #bbb;font-size:.95rem}
textarea{resize:vertical}
button{cursor:pointer}
.btn{background:#111;color:#fff;border:none}
.btn-gray{background:#666;color:#fff;border:none}

table{width:100%;border-collapse:collapse;margin-top:1rem}
th,td{padding:.6rem;border-bottom:1px solid #eee;text-align:left}
th{background:#f0f0f0}
tr:nth-child(even){background:#fafafa}

.red{color:#c62828;font-weight:700}
.green{color:#0a7d0a;font-weight:700}

#login{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#loginBox{background:#fff;padding:1.4rem;border-radius:14px;width:320px}
#loginBox input{width:100%;margin:.5rem 0}
#error{color:#c62828;font-size:.9rem;display:none}

@media(max-width:900px){.row{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="loginBox">
    <h3>Acceso</h3>
    <div id="error">Usuario o contraseña incorrectos</div>
    <input id="u" placeholder="Usuario">
    <input id="p" type="password" placeholder="Contraseña">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<div class="app">
  <h1>Efectivo</h1>
  <div class="sub">Registro de cobros por tienda</div>

  <div>
    Usuario actual: <b id="userTxt"></b>
    <button class="btn-gray" onclick="logout()">Cambiar</button>
  </div>

  <!-- ALTA -->
  <div class="row" style="margin-top:1rem">
    <div><label>Fecha</label><input type="date" id="fFecha"></div>
    <div><label>Importe anotado</label><input type="number" id="fImp"></div>
    <div><label>Tienda</label><textarea id="fTienda"></textarea></div>
    <div><label>Recibido</label>
      <select id="fRec">
        <option>No</option><option>Sí</option>
      </select>
    </div>
    <div><label>Importe recibido</label><input type="number" id="fReal"></div>
    <div><button class="btn" onclick="add()">Añadir</button></div>
  </div>

  <!-- FILTROS -->
  <div class="filters row">
    <div><label>Tienda</label><input id="ftTienda"></div>
    <div><label>Desde</label><input type="date" id="ftDesde"></div>
    <div><label>Hasta</label><input type="date" id="ftHasta"></div>
    <div><label>Recibido</label>
      <select id="ftRec">
        <option value="">Todos</option>
        <option>Sí</option><option>No</option>
      </select>
    </div>
    <div><label>Creador</label>
      <select id="ftUser"></select>
    </div>
    <div><button class="btn-gray" onclick="clearFilters()">Quitar filtros</button></div>
  </div>

  <div id="resumen"></div>

  <!-- TABLA -->
  <table>
    <thead>
      <tr>
        <th>Fecha</th><th>Día</th><th>Importe</th><th>Tienda</th>
        <th>Recibido</th><th>Real</th><th>Diferencia</th><th>Usuario</th><th></th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
/* USUARIOS */
const USERS=[
 {u:"admin",p:"1234"},
 {u:"tienda1",p:"1111"},
 {u:"tienda2",p:"2222"},
 {u:"tienda3",p:"3333"}
];

let data=JSON.parse(localStorage.getItem("efectivo")||"[]");
let actual=null;

/* LOGIN */
function login(){
 const u=document.getElementById("u").value;
 const p=document.getElementById("p").value;
 if(!USERS.find(x=>x.u===u&&x.p===p)){
  error.style.display="block";return;
 }
 actual=u;
 loginDiv.style.display="none";
 userTxt.textContent=u;
 loadUsers();
 render();
}
function logout(){actual=null;loginDiv.style.display="flex"}
const loginDiv=document.getElementById("login");

/* ADD */
function add(){
 if(!actual)return;
 data.push({
  fecha:fFecha.value,
  imp:+fImp.value||0,
  tienda:fTienda.value,
  rec:fRec.value,
  real:+fReal.value||0,
  user:actual
 });
 save();render();
}

/* FILTROS */
function clearFilters(){
 ftTienda.value=ftDesde.value=ftHasta.value=ftRec.value=ftUser.value="";
 render();
}

/* RENDER */
function render(){
 tb.innerHTML="";
 let list=data.filter(x=>{
  if(ftTienda.value && !x.tienda.toLowerCase().includes(ftTienda.value.toLowerCase()))return false;
  if(ftDesde.value && x.fecha<ftDesde.value)return false;
  if(ftHasta.value && x.fecha>ftHasta.value)return false;
  if(ftRec.value && x.rec!==ftRec.value)return false;
  if(ftUser.value && x.user!==ftUser.value)return false;
  return true;
 }).sort((a,b)=>b.fecha.localeCompare(a.fecha));

 let pendiente=0;
 list.forEach((x,i)=>{
  const d=(x.real||0)-(x.imp||0);
  if(x.rec==="No") pendiente+=x.imp;
  tb.innerHTML+=`
  <tr>
   <td>${x.fecha}</td>
   <td>${new Date(x.fecha).toLocaleDateString("es",{weekday:"short"})}</td>
   <td>${x.imp.toFixed(2)}</td>
   <td>${x.tienda}</td>
   <td class="${x.rec==="Sí"?"green":"red"}">${x.rec}</td>
   <td>${x.real.toFixed(2)}</td>
   <td class="${d<0?"red":"green"}">${d.toFixed(2)}</td>
   <td>${x.user}</td>
   <td><button onclick="del(${i})">✕</button></td>
  </tr>`;
 });

 resumen.textContent=`Movimientos: ${list.length} · Pendiente: ${pendiente.toFixed(2)} €`;
}

/* DELETE */
function del(i){
 if(confirm("¿Borrar?")){data.splice(i,1);save();render();}
}

/* HELPERS */
function save(){localStorage.setItem("efectivo",JSON.stringify(data))}
function loadUsers(){
 ftUser.innerHTML="<option value=''>Todos</option>";
 USERS.forEach(u=>ftUser.innerHTML+=`<option>${u.u}</option>`);
}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",render));
</script>
</body>
</html>
