<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Efectivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,Segoe UI,sans-serif}
body{margin:0;background:#e6e6e6;padding:1rem}
.app{max-width:1100px;margin:auto;background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.15)}
h1{margin:0}
button{border:none;border-radius:8px;padding:.6rem 1rem;cursor:pointer}
.btn{background:#111;color:#fff}
.btn-sec{background:#666;color:#fff}
.btn-del{background:#c62828;color:#fff}
input,select,textarea{width:100%;padding:.5rem;border-radius:8px;border:1px solid #bbb}
form, .filters{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;margin-top:1rem}
.filters{background:#f4f4f4;padding:1rem;border-radius:10px;margin-top:2rem}
table{width:100%;border-collapse:collapse;margin-top:1rem}
th,td{padding:.6rem;border-bottom:1px solid #eee;font-size:.9rem}
th{background:#f2f2f2}
.right{text-align:right}
@media(max-width:900px){
form,.filters{grid-template-columns:1fr}
}
#login{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#loginBox{background:#fff;padding:1.5rem;border-radius:14px;width:320px}
#error{color:#c62828;display:none}
</style>
</head>

<body>

<div id="login">
  <div id="loginBox">
    <h2>Acceso</h2>
    <div id="error">Credenciales incorrectas</div>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</div>

<div class="app">
<h1>Efectivo</h1>
<p>Registro de cobros por tienda</p>

<p>Usuario actual: <b id="uActual"></b>
<button class="btn-sec" onclick="logout()">Cambiar usuario</button></p>

<form onsubmit="add(event)">
<input type="date" id="fFecha">
<input type="number" id="fImporte" placeholder="Importe anotado">
<textarea id="fTienda" placeholder="Tienda"></textarea>
<select id="fRec">
<option>No</option><option>Sí</option>
</select>
<input type="number" id="fReal" placeholder="Importe recibido">
<button class="btn">Añadir</button>
</form>

<div class="filters">
<input id="fiTienda" placeholder="Filtrar tienda">
<input type="date" id="fiDesde">
<input type="date" id="fiHasta">
<select id="fiRec">
<option value="">Todos</option>
<option>Sí</option><option>No</option>
</select>
<select id="fiUser"></select>
<button class="btn-sec" onclick="clearFilters()">Quitar filtros</button>
</div>

<p id="resumen"></p>

<table>
<thead>
<tr>
<th>Fecha</th><th>Día</th><th>Importe</th><th>Tienda</th>
<th>Recibido</th><th>Real</th><th>Diferencia</th><th>Usuario</th><th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
const users=[
{u:"admin",p:"1234",r:"admin"},
{u:"tienda1",p:"1111",r:"tienda"},
{u:"tienda2",p:"2222",r:"tienda"},
{u:"tienda3",p:"3333",r:"tienda"}
];

let actual=null;
let datos=JSON.parse(localStorage.getItem("efectivo")||"[]");

function login(){
const u=user.value,p=pass.value;
const ok=users.find(x=>x.u===u&&x.p===p);
if(!ok){error.style.display="block";return}
actual=ok;
uActual.textContent=ok.u;
login.style.display="none";
loadUsers();
render();
}

function logout(){location.reload()}

function add(e){
e.preventDefault();
datos.push({
fecha:fFecha.value,
importe:+fImporte.value||0,
tienda:fTienda.value,
rec:fRec.value,
real:+fReal.value||0,
user:actual.u
});
save(); render(); e.target.reset();
}

function render(){
tbody.innerHTML="";
let list=datos.filter(d=>{
if(fiTienda.value && !d.tienda.toLowerCase().includes(fiTienda.value.toLowerCase()))return false;
if(fiDesde.value && d.fecha<fiDesde.value)return false;
if(fiHasta.value && d.fecha>fiHasta.value)return false;
if(fiRec.value && d.rec!==fiRec.value)return false;
if(fiUser.value && d.user!==fiUser.value)return false;
return true;
});

let pendiente=0;
list.forEach((d,i)=>{
const dif=d.importe-d.real;
if(d.rec==="No")pendiente+=dif;
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${d.fecha}</td>
<td>${new Date(d.fecha).toLocaleDateString("es",{weekday:"short"})}</td>
<td class="right">${d.importe.toFixed(2)}</td>
<td>${d.tienda}</td>
<td>
<select onchange="edit(${i},'rec',this.value)">
<option ${d.rec==="No"?"selected":""}>No</option>
<option ${d.rec==="Sí"?"selected":""}>Sí</option>
</select>
</td>
<td><input type="number" value="${d.real}" onchange="edit(${i},'real',this.value)"></td>
<td class="right">${dif.toFixed(2)}</td>
<td>${d.user}</td>
<td>${actual.r==="admin"?`<button class="btn-del" onclick="del(${i})">X</button>`:""}</td>`;
tbody.appendChild(tr);
});
resumen.textContent=`Movimientos: ${list.length} · Pendiente: ${pendiente.toFixed(2)} €`;
}

function edit(i,k,v){datos[i][k]=k==="real"?+v:v; save(); render()}
function del(i){if(confirm("¿Borrar?")){datos.splice(i,1);save();render()}}
function save(){localStorage.setItem("efectivo",JSON.stringify(datos))}
function clearFilters(){fiTienda.value=fiDesde.value=fiHasta.value=fiRec.value=fiUser.value="";render()}
function loadUsers(){
fiUser.innerHTML="<option value=''>Todos</option>";
users.forEach(u=>fiUser.innerHTML+=`<option>${u.u}</option>`);
}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",render));
</script>

</body>
</html>
