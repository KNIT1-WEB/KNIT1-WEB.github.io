<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Efectivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 1rem;
      background: #e6e6e6;
      color: #1a1a1a;
    }

    .app-container {
      max-width: 1200px;
      margin: auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }

    h1 {
      margin: 0 0 .5rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: end;
    }

    label {
      font-size: .85rem;
      font-weight: 600;
      display: block;
      margin-bottom: .3rem;
    }

    input, select {
      width: 100%;
      padding: .55rem;
      border-radius: 8px;
      border: 1px solid #bbb;
      font-size: .9rem;
    }

    button {
      border: none;
      padding: .7rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      background: #1a1a1a;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: .6rem;
      border-bottom: 1px solid #ddd;
      font-size: .9rem;
    }

    th {
      background: #f2f2f2;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .text-right {
      text-align: right;
    }

    .negativo {
      color: #c62828;
      font-weight: 700;
    }

    .positivo {
      color: #0a7d0a;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div class="app-container">
  <h1>Efectivo</h1>

  <!-- FORMULARIO -->
  <form id="formCobro">
    <div>
      <label>Fecha</label>
      <input type="date" id="fecha" required>
    </div>

    <div>
      <label>Tienda</label>
      <input type="text" id="tienda" required>
    </div>

    <div>
      <label>Importe esperado (€)</label>
      <input type="number" id="importeEsperado" step="0.01" required>
    </div>

    <div>
      <label>Importe recibido (€)</label>
      <input type="number" id="importeRecibido" step="0.01" required>
    </div>

    <div>
      <label>Recibido</label>
      <select id="recibido">
        <option>Sí</option>
        <option>No</option>
      </select>
    </div>

    <div>
      <label>&nbsp;</label>
      <button>Añadir</button>
    </div>
  </form>

  <!-- TABLA -->
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Tienda</th>
        <th class="text-right">Esperado</th>
        <th class="text-right">Recibido</th>
        <th class="text-right">Diferencia</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

<script>
  let datos = JSON.parse(localStorage.getItem("efectivo") || "[]");

  const form = document.getElementById("formCobro");
  const tabla = document.getElementById("tabla");

  form.addEventListener("submit", e => {
    e.preventDefault();

    const esperado = parseFloat(importeEsperado.value);
    const recibido = parseFloat(importeRecibido.value);
    const diferencia = recibido - esperado;

    datos.push({
      fecha: fecha.value,
      tienda: tienda.value,
      esperado,
      recibido,
      diferencia,
      estado: recibido === esperado ? "OK" : "Revisar"
    });

    guardar();
    form.reset();
  });

  function guardar() {
    localStorage.setItem("efectivo", JSON.stringify(datos));
    render();
  }

  function render() {
    tabla.innerHTML = "";

    datos
      .sort((a, b) => b.fecha.localeCompare(a.fecha))
      .forEach((d, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.fecha}</td>
          <td>${d.tienda}</td>
          <td class="text-right">${d.esperado.toFixed(2)}</td>
          <td class="text-right">${d.recibido.toFixed(2)}</td>
          <td class="text-right ${d.diferencia !== 0 ? "negativo" : "positivo"}">
            ${d.diferencia.toFixed(2)}
          </td>
          <td>${d.estado}</td>
          <td><button onclick="borrar(${i})">✕</button></td>
        `;
        tabla.appendChild(tr);
      });
  }

  function borrar(i) {
    if (!confirm("¿Borrar este registro?")) return;
    datos.splice(i, 1);
    guardar();
  }

  render();
</script>
</body>
</html>
